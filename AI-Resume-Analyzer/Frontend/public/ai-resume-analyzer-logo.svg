<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08d9f5"/>
      <stop offset="45%" stop-color="#123edb"/>
      <stop offset="100%" stop-color="#7b12f5"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27e5ff"/>
      <stop offset="100%" stop-color="#1262e8"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08b8ff"/>
      <stop offset="100%" stop-color="#8b19ef"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- Main circular badge -->
  <circle cx="256" cy="256" r="232" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#19e5ff" stroke-width="8"/>
  <path d="M45 350 Q180 430 315 410 T475 350 Q430 465 256 488 Q80 465 45 350Z"
        fill="#7b12f5" opacity=".35"/>

  <!-- AI circuit traces -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 175 L365 120 L365 92" stroke="#4ff4ff" stroke-width="7"/>
    <path d="M330 205 L405 130 L405 100" stroke="#4ff4ff" stroke-width="7"/>
    <path d="M345 235 L438 180 L438 145" stroke="#c85cff" stroke-width="7"/>
    <path d="M355 265 L430 265 L430 235" stroke="#4ff4ff" stroke-width="7"/>
    <circle cx="365" cy="92" r="10" stroke="#4ff4ff" stroke-width="6"/>
    <circle cx="405" cy="100" r="10" stroke="#4ff4ff" stroke-width="6"/>
    <circle cx="438" cy="145" r="10" stroke="#c85cff" stroke-width="6"/>
    <circle cx="430" cy="235" r="10" stroke="#4ff4ff" stroke-width="6"/>
  </g>

  <!-- Resume shadow -->
  <g filter="url(#shadow)">
    <rect x="112" y="88" width="235" height="330" rx="22"
          transform="rotate(-8 112 88)" fill="#0b1b87" opacity=".65"/>
    <!-- Resume -->
    <rect x="98" y="78" width="235" height="330" rx="22"
          transform="rotate(-8 98 78)" fill="url(#paper)"/>
  </g>

  <!-- Resume profile -->
  <g transform="rotate(-8 98 78)">
    <circle cx="155" cy="145" r="31" fill="#173cc7"/>
    <path d="M118 202 Q155 167 192 202 Q192 222 155 222 Q118 222 118 202Z"
          fill="#173cc7"/>
    <rect x="210" y="122" width="82" height="12" rx="6" fill="#2583ed"/>
    <rect x="210" y="148" width="66" height="10" rx="5" fill="#5a8eea"/>
    <circle cx="132" cy="254" r="8" fill="#214bd0"/>
    <rect x="153" y="247" width="135" height="12" rx="6" fill="#3f7feb"/>
    <circle cx="132" cy="286" r="8" fill="#214bd0"/>
    <rect x="153" y="279" width="118" height="12" rx="6" fill="#3f7feb"/>
    <circle cx="132" cy="318" r="8" fill="#214bd0"/>
    <rect x="153" y="311" width="128" height="12" rx="6" fill="#3f7feb"/>
    <circle cx="132" cy="350" r="8" fill="#214bd0"/>
    <rect x="153" y="343" width="100" height="12" rx="6" fill="#3f7feb"/>
  </g>

  <!-- Magnifying glass -->
  <g filter="url(#shadow)">
    <circle cx="305" cy="315" r="91" fill="url(#glass)" stroke="#0b36b9" stroke-width="9"/>
    <circle cx="305" cy="315" r="70" fill="#f7fbff" stroke="#d9eaff" stroke-width="5"/>
    <path d="M359 369 L423 433" stroke="#1262e8" stroke-width="30" stroke-linecap="round"/>
    <path d="M359 369 L423 433" stroke="#31b8ff" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- AI letters -->
  <text x="305" y="342" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="82" font-weight="900" fill="url(#ai)">AI</text>

  <!-- Small highlight -->
  <path d="M248 257 Q275 225 309 226" fill="none" stroke="#ffffff"
        stroke-width="9" stroke-linecap="round" opacity=".75"/>
</svg>
